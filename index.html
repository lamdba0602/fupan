<meta property="og:title" content="复盘：身体残疾卧床 3 年，我是如何突破人生低谷，一步一步赚到 100 万？">

<style>
/* Layout: a single reading column, like turning the pages of a printed notebook; a quiet header, then the pages in order. */
:root {
  --bg: #f3f4f1;
  --paper: #ffffff;
  --fg: #1f2421;
  --muted: #5d665f;
  --line: #d9ddd6;
  --accent: #2f6b4f;
  --accent-fg: #ffffff;
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161a17; --fg: #e7ebe6; --muted: #a3ada5; --line: #2c332e; --accent: #7fc3a0; --accent-fg: #10140f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.75;
}
.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
header { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 13px; letter-spacing: 0.08em; color: var(--accent); font-weight: 600; }
h1 {
  font-family: var(--font-display);
  font-size: clamp(24px, 5.2vw, 36px);
  line-height: 1.35;
  margin: 0;
  text-wrap: balance;
}
.lede { margin: 0; max-width: 40em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  display: inline-block;
  background: var(--accent);
  color: var(--accent-fg);
  text-decoration: none;
  font-size: 15px;
  font-weight: 600;
  padding: 9px 18px;
  border-radius: 6px;
}
.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.size { font-size: 13px; color: var(--muted); }
.note { margin: 0; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.note a, footer a { color: var(--accent); }
.pages { display: flex; flex-direction: column; gap: 18px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
figure img {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
}
figcaption { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.counter {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--fg);
  color: var(--bg);
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
  opacity: 0.88;
}
footer { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">成长复盘 · 2024 年写 · 共 102 页</div>
    <h1>复盘：身体残疾卧床 3 年，我是如何突破人生低谷，一步一步赚到 100 万？</h1>
    <p class="lede">我是明白，程序员出身。高二确诊强直性脊柱炎，2016 到 2019 年在老家卧床 3 年。2024 年，我花了一个月把这一路写成复盘，大约 4 万字，从生病、借钱学习、做第一门课，写到开始日更。</p>
    <div class="actions">
      <a class="btn" href="fupan.pdf" download="明白的成长复盘（公开版）.pdf">下载 PDF</a>
      <span class="size">约 12 MB，也可以直接往下翻着读</span>
    </div>
    <p class="note">这是公开版：证件照片上的个人信息已打码，删去了一章社群介绍，其余内容和原版一样。我在 X：<a href="https://x.com/forrest62_dang" target="_blank" rel="noopener">@forrest62_dang</a></p>
  </header>

  <main class="pages" id="pages" aria-label="复盘正文，共 102 页"></main>

  <footer>读到这里，谢谢你。希望它能带给你一点力量。</footer>
</div>

<div class="counter" id="counter" aria-live="polite">第 1 / 102 页</div>

<script>
(function () {
  var TOTAL = 102, W = 1075, H = 1519;
  var box = document.getElementById('pages');
  var counter = document.getElementById('counter');
  var frag = document.createDocumentFragment();
  for (var i = 1; i <= TOTAL; i++) {
    var n = String(i).padStart(3, '0');
    var fig = document.createElement('figure');
    fig.id = 'p' + i;
    fig.dataset.page = i;
    var img = document.createElement('img');
    img.src = 'p/' + n + '.jpg';
    img.width = W; img.height = H;
    img.alt = '复盘第 ' + i + ' 页';
    img.loading = i <= 3 ? 'eager' : 'lazy';
    img.decoding = 'async';
    var cap = document.createElement('figcaption');
    cap.textContent = i + ' / ' + TOTAL;
    fig.appendChild(img); fig.appendChild(cap);
    frag.appendChild(fig);
  }
  box.appendChild(frag);
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) counter.textContent = '第 ' + e.target.dataset.page + ' / ' + TOTAL + ' 页';
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    box.querySelectorAll('figure').forEach(function (f) { io.observe(f); });
  }
})();
</script>
</body>
</html>
